<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fretboard Lab 🎸</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // The app rewrites / to /caged/ on load; count it under /caged/ whichever runs first.
      // The query holds a page's settings, so drop it to keep one row per page.
      window.goatcounter = {
        path: function (p) {
          return p.split('?')[0].replace(/^\/$/, '/caged/');
        },
      };
    </script>
    <script
      data-goatcounter="https://guitar-hribar.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
